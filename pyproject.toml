[project]
name = "mindweaver-core"
version = "0.2.0"
description = "Core Python per il plugin Mind Weaver"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.25",
    "pyyaml>=6.0",
]

[project.scripts]
mw-critique = "mindweaver.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mindweaver"]